<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz · Sport in den 1920er Jahren</title>

  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="animations.css"/>

  <style>
    /* minimal required UI helpers */
    .hidden { display: none; }

    .quiz-container {
      max-width: 700px;
      margin: 60px auto;
      padding: 20px;
    }

    .question-card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      transition: all 0.4s ease;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .answer {
      padding: 12px;
      border: 2px solid #d0d7e2;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .answer:hover {
      border-color: #1e66ff;
      transform: translateX(3px);
    }

    .answer.selected {
      background: #1e66ff;
      color: white;
      border-color: #1e66ff;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 15px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .btn-primary { background: #1e66ff; color: white; }
    .btn-danger { background: #e63946; color: white; }

    #startScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f6f8fb;
      flex-direction: column;
    }

    #startBtn {
      font-size: 22px;
      padding: 20px 40px;
      background: #1e66ff;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    #results {
      max-width: 700px;
      margin: 60px auto;
    }
  </style>
</head>

<body>

<header class="site-header">
  <a class="brand" href="index.html">1920er Sport</a>
</header>

<!-- START SCREEN -->
<div id="startScreen">
  <h1>Quiz</h1>
  <button id="startBtn">Start</button>
</div>

<!-- QUIZ -->
<main class="quiz-container hidden" id="quizContainer">

  <div id="progress"></div>

  <div class="question-card" id="questionBox"></div>

  <div class="nav-buttons">
    <button class="btn" id="backBtn">⬅</button>
    <button class="btn btn-primary" id="nextBtn">➡ Weiter</button>
  </div>

  <button class="btn btn-danger" id="abortBtn" style="position:fixed; bottom:20px; right:20px;">
    Quiz beenden
  </button>

</main>

<!-- RESULTS -->
<div id="results" class="hidden"></div>

<script src="quiz.js"></script>

</body>
</html>
